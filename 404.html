  <script src="js/main.js"></script>
  <script>
    (function () {
      var layer = document.getElementById("app404CodeLayer");
      if (!layer) return;

      var tokens = [
        "0", "1", "2", "3", "7", "9",
        "10", "11", "13", "17", "19",
        "20", "22", "24", "28", "34",
        "404", "512", "1024", "2048",
        "0x0", "0x1", "0xA", "0xF",
        "UID", "VAR", "IDX", "ERR", "LOG",
        "AES", "SHA", "TLS", "HTTP", "GDPR"
      ];

      function rand(min, max) {
        return Math.random() * (max - min) + min;
      }

      // Keep a "hole" around the center where the big 404 sits.
      // We still use CSS masking, but this reduces visual clutter.
      var holeRadius = 0.22; // fraction of viewport
      function inCenterHole(x, y) {
        var dx = x - 0.5;
        var dy = y - 0.45; // slightly higher
        return Math.sqrt(dx * dx + dy * dy) < holeRadius;
      }

      var count = 280;
      for (var i = 0; i < count; i++) {
        var tries = 0;
        var x = 0, y = 0;
        while (tries < 30) {
          x = Math.random();
          y = Math.random();
          if (!inCenterHole(x, y)) break;
          tries++;
        }

        var span = document.createElement("span");
        span.textContent = tokens[(Math.random() * tokens.length) | 0];
        span.style.left = (x * 100) + "%";
        span.style.top = (y * 100) + "%";

        var size = rand(12, 26);
        span.style.fontSize = size + "px";
        span.style.opacity = rand(0.12, 0.28);
        span.style.filter = "blur(" + rand(0, 0.8) + "px)";

        // Random rotation for code feel (kept in sync with the animation keyframes).
        var rot = rand(-12, 12) + "deg";
        span.style.setProperty("--r", rot);
        span.style.transform = "translate(-50%, -50%) rotate(" + rot + ")";
        span.style.setProperty("--d", (-rand(0, 6)) + "s");

        layer.appendChild(span);
      }
    })();
  </script>

  <style>
    /* Random code field around edges with a center "hole" */
    .app404-code-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .app404-code-layer {
      position: absolute;
      inset: -10vh -10vw;
      /* fade out toward the center */
      -webkit-mask-image: radial-gradient(
        ellipse 62% 56% at 50% 45%,
        transparent 0%,
        rgba(0, 0, 0, 0.0) 28%,
        rgba(0, 0, 0, 0.45) 48%,
        black 78%
      );
      mask-image: radial-gradient(
        ellipse 62% 56% at 50% 45%,
        transparent 0%,
        rgba(0, 0, 0, 0.0) 28%,
        rgba(0, 0, 0, 0.45) 48%,
        black 78%
      );
      opacity: 1;
    }

    .app404-code-layer span {
      position: absolute;
      color: rgba(210, 240, 255, 0.65);
      font-weight: 600;
      letter-spacing: 0.02em;
      transform-origin: center;
      animation: app404-code-float 5.5s ease-in-out infinite;
      animation-delay: var(--d, -2s);
    }

    @keyframes app404-code-float {
      0%,
      100% {
        opacity: 0.0;
        transform: translate(-50%, -50%) rotate(var(--r, 0deg)) translateY(0);
      }
      45% {
        opacity: 0.26;
        transform: translate(-50%, -50%) rotate(var(--r, 0deg)) translateY(-10px);
      }
    }

    .page-main-404 {
      padding: 3.75rem 0 2.25rem;
      justify-content: center;
      align-items: center;
    }

    .app404-center {
      position: relative;
      z-index: 2;
      width: min(40rem, 92vw);
      min-height: 45vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .app404-center .app404-code-fadein {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app404-code-fadein {
      animation: app404-pop 0.9s ease both;
    }

    @keyframes app404-pop {
      from {
        opacity: 0;
        filter: blur(10px);
        transform: translateY(10px) scale(0.99);
      }
      to {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0) scale(1);
      }
    }

    .app404-title {
      font-size: clamp(6.3rem, 15vw, 10.95rem);
      font-weight: 650;
      line-height: 1;
      color: rgba(232, 255, 246, 0.75);
      letter-spacing: -0.06em;
      margin-bottom: 1.25rem;
    }

    .app404-subtitle {
      color: var(--muted);
      font-size: clamp(1.05rem, 3.5vw, 1.35rem);
      margin-bottom: 6.5rem;
    }

    .app404-actions {
      display: flex;
      justify-content: center;
      gap: 2.55rem;
      flex-wrap: wrap;
    }

    @media (max-width: 700px) {
      .page-main-404 {
        padding-top: 2.75rem;
      }

      .app404-actions {
        gap: 0.55rem;
      }
    }
  </style>
