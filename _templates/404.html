  <script>
    (function () {
      var layer = document.getElementById("app404CodeLayer");
      if (!layer) return;

      var tokens = [
        "0", "1", "2", "3", "7", "9",
        "10", "11", "13", "17", "19",
        "20", "22", "24", "28", "34",
        "404", "512", "1024", "2048",
        "0x0", "0x1", "0xA", "0xF",
        "UID", "VAR", "IDX", "ERR", "LOG",
        "AES", "SHA", "TLS", "HTTP", "GDPR"
      ];

      function rand(min, max) {
        return Math.random() * (max - min) + min;
      }

      var holeRadius = 0.22;
      var cx = 0.5;
      var cy = 0.45;
      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var nodes = [];
      var perWave = 90;

      function spawnWave(dir, className) {
        for (var i = 0; i < perWave; i++) {
          var tries = 0;
          var x = 0, y = 0;
          while (tries < 30) {
            x = Math.random();
            y = Math.random();
            var dx0 = x - cx;
            var dy0 = y - cy;
            if (Math.sqrt(dx0 * dx0 + dy0 * dy0) >= holeRadius) break;
            tries++;
          }

          var nx = (x - cx) * 2.2;
          var ny = (y - cy) * 2.2;
          // Hyperbolic paraboloid (saddle) + hyperboloid radial term.
          var saddle = nx * nx - ny * ny;
          var radial = Math.asinh(Math.sqrt(nx * nx + ny * ny) * 2.4);
          // Invert surface for reverse wave so peaks/valleys don't align.
          var surface = (radial * 1.65 + saddle * 1.35) * dir;

          var span = document.createElement("span");
          if (className) span.className = className;
          span.textContent = tokens[(Math.random() * tokens.length) | 0];
          span.style.left = (x * 100) + "%";
          span.style.top = (y * 100) + "%";
          span.style.fontSize = rand(12, 26) + "px";

          var rot = rand(-12, 12);
          layer.appendChild(span);

          nodes.push({
            el: span,
            surface: surface,
            rot: rot,
            dir: dir,
            speed: dir > 0 ? 1.55 : 1.35
          });
        }
      }

      // Two equal fields traveling opposite ways on the same surface family.
      spawnWave(1, "wave-a");
      spawnWave(-1, "wave-b");

      function paint(tSec) {
        for (var i = 0; i < nodes.length; i++) {
          var n = nodes[i];
          // Opposite dirs: one advances along +surface, the other against it.
          var phase = n.surface - tSec * n.speed * n.dir;
          var wave = Math.sin(phase);
          var gate = Math.max(0, wave);
          var opacity = 0.03 + gate * 0.28;
          var lift = wave * -11 * n.dir;
          var scale = 0.94 + gate * 0.08;

          n.el.style.opacity = opacity.toFixed(3);
          n.el.style.transform =
            "translate(-50%, -50%) rotate(" + n.rot + "deg) translateY(" + lift.toFixed(2) + "px) scale(" + scale.toFixed(3) + ")";
        }
      }

      if (reduceMotion) {
        paint(0.8);
        return;
      }

      var start = performance.now();
      function frame(now) {
        paint((now - start) / 1000);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>

  <style>
    /* Random code field around edges with a center "hole" */
    .app404-code-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .app404-code-layer {
      position: absolute;
      inset: -10vh -10vw;
      opacity: 1;
    }

    .app404-code-layer span {
      position: absolute;
      color: rgba(210, 240, 255, 0.65);
      font-weight: 600;
      letter-spacing: 0.02em;
      transform-origin: center;
      opacity: 0;
      will-change: transform, opacity;
    }

    .app404-code-layer span.wave-b {
      color: rgba(170, 230, 255, 0.55);
    }

    @media (prefers-reduced-motion: reduce) {
      .app404-code-layer span {
        will-change: auto;
      }

      .app404-code-fadein {
        animation: none;
      }
    }

    .page-main-404 {
      padding: 3.75rem 0 2.25rem;
      justify-content: center;
      align-items: center;
    }

    .app404-center {
      position: relative;
      z-index: 2;
      width: min(40rem, 92vw);
      min-height: 45vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .app404-center .app404-code-fadein {

      flex-direction: column;

    .app404-code-fadein {

    @keyframes app404-pop {

        transform: translateY(10px) scale(0.99);

      to {

        filter: blur(0);
        transform: translateY(0) scale(1);
      }

    .app404-title {

      font-weight: 650;
      line-height: 1;
      color: rgba(232, 255, 246, 0.75);

      margin-bottom: 1.25rem;
    }

    .app404-subtitle {

      }
